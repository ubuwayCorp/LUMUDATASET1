<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMU AI Assistant</title>
    <!-- Добавляем FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Базовые стили и сброс */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
        }

        :root {
            --dark-gray: #1a1a1a;
            --medium-gray: #2d2d2d;
            --light-gray: #3d3d3d;
            --border-white: #e0e0e0;
            --text-white: #ffffff;
            --text-gray: #b0b0b0;
            --text-light: #d0d0d0;
            --accent-gray: #4a4a4a;
            --hover-gray: #353535;
            --shadow: rgba(0, 0, 0, 0.3);
            --error-red: #ff6b6b;
            --success-green: #51cf66;
            --warning-yellow: #fcc419;
        }

        body {
            background-color: var(--dark-gray);
            color: var(--text-white);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Контейнер приложения */
        .app-container {
            width: 100%;
            max-width: 1200px;
            height: 95vh;
            background-color: var(--medium-gray);
            border-radius: 12px;
            border: 1px solid var(--border-white);
            overflow: hidden;
            display: flex;
            box-shadow: 0 8px 32px var(--shadow);
        }

        /* Боковая панель чатов */
        .sidebar {
            width: 280px;
            background-color: var(--dark-gray);
            border-right: 1px solid var(--border-white);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 24px 20px;
            border-bottom: 1px solid var(--border-white);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .logo-subtitle {
            font-size: 12px;
            color: var(--text-gray);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .user-info {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--border-white);
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            background-color: var(--light-gray);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            border: 1px solid var(--border-white);
        }

        .user-details {
            flex: 1;
        }

        .username {
            font-weight: 600;
            font-size: 15px;
        }

        .user-ip {
            font-size: 11px;
            color: var(--text-gray);
            margin-top: 2px;
        }

        .new-chat-btn {
            margin: 20px;
            padding: 12px;
            background-color: var(--light-gray);
            border: 1px solid var(--border-white);
            border-radius: 8px;
            color: var(--text-white);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .new-chat-btn:hover {
            background-color: var(--hover-gray);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 20px;
        }

        .chat-item {
            padding: 12px;
            margin: 8px 0;
            background-color: var(--medium-gray);
            border-radius: 8px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .chat-item:hover {
            border-color: var(--border-white);
            background-color: var(--light-gray);
        }

        .chat-item.active {
            background-color: var(--light-gray);
            border-color: var(--border-white);
        }

        .chat-preview {
            font-size: 13px;
            color: var(--text-gray);
            margin-top: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logout-btn {
            margin: 20px;
            padding: 12px;
            background-color: transparent;
            border: 1px solid var(--border-white);
            border-radius: 8px;
            color: var(--text-white);
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background-color: var(--light-gray);
        }

        /* Основная область чата */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: var(--medium-gray);
        }

        .chat-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-white);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-title {
            font-weight: 600;
            font-size: 18px;
        }

        .chat-date {
            font-size: 13px;
            color: var(--text-gray);
        }

        .messages-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .welcome-icon {
            font-size: 48px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        .welcome-title {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: 1px;
        }

        .welcome-text {
            font-size: 16px;
            color: var(--text-gray);
            line-height: 1.6;
        }

        .message {
            max-width: 70%;
            padding: 16px 20px;
            border-radius: 12px;
            line-height: 1.5;
            position: relative;
            font-size: 14px;
            word-wrap: break-word;
            overflow-wrap: break-word;
        }

        .message-ai {
            align-self: flex-start;
            background-color: var(--dark-gray);
            border: 1px solid var(--border-white);
            border-top-left-radius: 4px;
        }

        .message-user {
            align-self: flex-end;
            background-color: var(--light-gray);
            border: 1px solid var(--border-white);
            border-top-right-radius: 4px;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-gray);
            margin-top: 6px;
            text-align: right;
        }

        /* Поле ввода */
        .input-container {
            padding: 20px 24px;
            border-top: 1px solid var(--border-white);
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .message-input {
            flex: 1;
            padding: 16px 20px;
            padding-right: 60px;
            background-color: var(--dark-gray);
            border: 1px solid var(--border-white);
            border-radius: 24px;
            color: var(--text-white);
            font-size: 15px;
            resize: none;
            min-height: 52px;
            max-height: 120px;
            line-height: 1.5;
            font-family: inherit;
        }

        .message-input:focus {
            outline: none;
            border-color: var(--text-light);
        }

        .send-button {
            position: absolute;
            right: 8px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--light-gray);
            border: 1px solid var(--border-white);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .send-button:hover {
            background-color: var(--hover-gray);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .send-icon {
            color: var(--text-white);
            font-size: 16px;
            transform: rotate(90deg);
        }

        /* Экран авторизации */
        .auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            background-color: var(--medium-gray);
            border-radius: 12px;
            border: 1px solid var(--border-white);
            box-shadow: 0 8px 32px var(--shadow);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .auth-logo {
            font-size: 42px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .auth-subtitle {
            font-size: 14px;
            color: var(--text-gray);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-white);
            margin-bottom: 20px;
        }

        .auth-tab {
            flex: 1;
            padding: 12px;
            text-align: center;
            background: none;
            border: none;
            color: var(--text-gray);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .auth-tab.active {
            color: var(--text-white);
        }

        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: var(--border-white);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 14px;
            color: var(--text-light);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-input {
            padding: 14px 16px;
            background-color: var(--dark-gray);
            border: 1px solid var(--border-white);
            border-radius: 8px;
            color: var(--text-white);
            font-size: 15px;
            transition: border-color 0.2s;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--text-light);
        }

        .auth-button {
            padding: 14px;
            background-color: var(--light-gray);
            border: 1px solid var(--border-white);
            border-radius: 8px;
            color: var(--text-white);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
            font-family: inherit;
        }

        .auth-button:hover:not(:disabled) {
            background-color: var(--hover-gray);
        }

        .auth-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-message {
            font-size: 13px;
            text-align: center;
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            display: none;
        }

        .auth-message.error {
            background-color: rgba(255, 100, 100, 0.1);
            border: 1px solid rgba(255, 100, 100, 0.3);
            color: var(--error-red);
            display: block;
        }

        .auth-message.success {
            background-color: rgba(100, 255, 100, 0.1);
            border: 1px solid rgba(100, 255, 100, 0.3);
            color: var(--success-green);
            display: block;
        }

        .ip-warning {
            font-size: 12px;
            color: var(--text-gray);
            text-align: center;
            margin-top: 16px;
            padding: 12px;
            background-color: rgba(255, 255, 255, 0.05);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Экран бана */
        .ban-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--dark-gray);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2000;
        }

        .ban-container {
            max-width: 500px;
            padding: 40px;
            text-align: center;
            background-color: var(--medium-gray);
            border-radius: 12px;
            border: 1px solid var(--border-white);
            box-shadow: 0 8px 32px var(--shadow);
        }

        .ban-icon {
            font-size: 64px;
            margin-bottom: 24px;
            color: var(--error-red);
        }

        .ban-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--error-red);
        }

        .ban-message {
            font-size: 16px;
            color: var(--text-gray);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .ban-details {
            background-color: var(--dark-gray);
            border-radius: 8px;
            padding: 16px;
            margin-top: 20px;
            border: 1px solid rgba(255, 100, 100, 0.3);
        }

        .ban-details p {
            font-size: 14px;
            color: var(--text-light);
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Индикатор набора */
        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 16px 20px;
            background-color: var(--dark-gray);
            border: 1px solid var(--border-white);
            border-radius: 12px;
            align-self: flex-start;
            width: fit-content;
            border-top-left-radius: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--text-gray);
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: -0.32s; }
        .typing-dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes typing {
            0%, 80%, 100% { transform: scale(0.8); opacity: 0.5; }
            40% { transform: scale(1); opacity: 1; }
        }

        /* Утилиты */
        .hidden {
            display: none !important;
        }

        .scrollbar {
            scrollbar-width: thin;
            scrollbar-color: var(--light-gray) var(--dark-gray);
        }

        .scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbar::-webkit-scrollbar-track {
            background: var(--dark-gray);
        }

        .scrollbar::-webkit-scrollbar-thumb {
            background-color: var(--light-gray);
            border-radius: 3px;
        }

        /* Сообщение об ошибке ввода */
        .input-error {
            color: var(--error-red);
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .input-error.show {
            display: block;
        }

        /* Счетчик символов */
        .char-counter {
            position: absolute;
            right: 60px;
            bottom: 8px;
            font-size: 12px;
            color: var(--text-gray);
        }

        .char-counter.warning {
            color: var(--warning-yellow);
        }

        .char-counter.error {
            color: var(--error-red);
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .app-container {
                height: 100vh;
                border-radius: 0;
                border: none;
            }
            
            .sidebar {
                width: 80px;
            }
            
            .sidebar-header .logo-subtitle,
            .user-details,
            .chat-preview {
                display: none;
            }
            
            .logo {
                font-size: 22px;
                text-align: center;
            }
            
            .message {
                max-width: 85%;
            }
            
            .char-counter {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Экран бана -->
    <div id="banScreen" class="ban-screen hidden">
        <div class="ban-container">
            <div class="ban-icon">
                <i class="fas fa-ban"></i>
            </div>
            <h1 class="ban-title">Доступ запрещен</h1>
            <p class="ban-message">
                На территории Украины в связи с санкциями доступ к сервису ограничен.
            </p>
            <div class="ban-details">
                <p><i class="fas fa-globe"></i> IP-адрес: <span id="bannedIP">192.168.1.1</span></p>
                <p><i class="fas fa-clock"></i> Часовой пояс: <span id="bannedTimezone">Europe/Kiev</span></p>
                <p><i class="fas fa-language"></i> Язык системы: <span id="bannedLanguage">uk-UA</span></p>
            </div>
        </div>
    </div>

    <!-- Экран авторизации -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-container">
            <div class="auth-header">
                <div class="auth-logo">LUMU</div>
                <div class="auth-subtitle">AI Assistant</div>
            </div>
            
            <div class="auth-tabs">
                <button class="auth-tab active" type="button" data-tab="login">Вход</button>
                <button class="auth-tab" type="button" data-tab="register">Регистрация</button>
            </div>
            
            <!-- Форма входа -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label class="form-label" for="loginUsername">
                        <i class="fas fa-user"></i> Ник
                    </label>
                    <input type="text" id="loginUsername" class="form-input" placeholder="Ваш ник" required maxlength="20">
                    <div id="loginUsernameError" class="input-error"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="loginPassword">
                        <i class="fas fa-lock"></i> Пароль
                    </label>
                    <input type="password" id="loginPassword" class="form-input" placeholder="Пароль" required maxlength="100">
                    <div id="loginPasswordError" class="input-error"></div>
                </div>
                
                <button type="submit" class="auth-button" id="loginButton">Войти</button>
                
                <div id="loginMessage" class="auth-message"></div>
            </form>
            
            <!-- Форма регистрации -->
            <form id="registerForm" class="auth-form hidden">
                <div class="form-group">
                    <label class="form-label" for="registerUsername">
                        <i class="fas fa-user"></i> Ник
                    </label>
                    <input type="text" id="registerUsername" class="form-input" placeholder="Придумайте ник (3-20 символов)" required minlength="3" maxlength="20">
                    <div id="registerUsernameError" class="input-error"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="registerPassword">
                        <i class="fas fa-lock"></i> Пароль
                    </label>
                    <input type="password" id="registerPassword" class="form-input" placeholder="Создайте пароль (6-100 символов)" required minlength="6" maxlength="100">
                    <div id="registerPasswordError" class="input-error"></div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="registerConfirmPassword">
                        <i class="fas fa-lock"></i> Подтвердите пароль
                    </label>
                    <input type="password" id="registerConfirmPassword" class="form-input" placeholder="Повторите пароль" required maxlength="100">
                    <div id="registerConfirmPasswordError" class="input-error"></div>
                </div>
                
                <button type="submit" class="auth-button" id="registerButton">Зарегистрироваться</button>
                
                <div id="registerMessage" class="auth-message"></div>
                
                <div class="ip-warning">
                    <i class="fas fa-info-circle"></i> Можно зарегистрировать только 1 аккаунт с одного IP-адреса
                </div>
            </form>
        </div>
    </div>

    <!-- Основной интерфейс -->
    <div id="appScreen" class="app-container hidden">
        <!-- Боковая панель -->
        <div class="sidebar">
            <div class="sidebar-header">
                <div class="logo">LUMU</div>
                <div class="logo-subtitle">AI Assistant</div>
            </div>
            
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
                <div class="user-details">
                    <div class="username" id="username">User</div>
                    <div class="user-ip" id="userIP">IP: 192.168.1.1</div>
                </div>
            </div>
            
            <button class="new-chat-btn" id="newChatBtn" type="button">
                <i class="fas fa-plus"></i>
                <span>Новый чат</span>
            </button>
            
            <div class="chats-list scrollbar" id="chatsList">
                <!-- Список чатов будет здесь -->
            </div>
            
            <button class="logout-btn" id="logoutBtn" type="button">
                <i class="fas fa-sign-out-alt"></i>
                <span>Выйти</span>
            </button>
        </div>
        
        <!-- Область чата -->
        <div class="chat-area">
            <div class="chat-header">
                <div class="chat-title" id="currentChatTitle">Новый чат</div>
                <div class="chat-date" id="currentChatDate"></div>
            </div>
            
            <div class="messages-container scrollbar" id="messagesContainer">
                <!-- Сообщения будут здесь -->
            </div>
            
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea class="message-input scrollbar" id="messageInput" 
                              placeholder="Введите ваше сообщение..." 
                              rows="1" maxlength="2000"></textarea>
                    <div id="charCounter" class="char-counter">0/2000</div>
                    <button class="send-button" id="sendButton" type="button" disabled>
                        <i class="fas fa-arrow-up send-icon"></i>
                    </button>
                </div>
                <div id="messageInputError" class="input-error"></div>
            </div>
        </div>
    </div>

    <script>
        // Безопасные утилиты
        const SecurityUtils = {
            // Экранирование HTML для предотвращения XSS
            escapeHtml: function(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            },
            
            // Базовая хеш-функция для паролей (для демо, в продакшене используйте серверную аутентификацию)
            hashPassword: async function(password) {
                try {
                    const encoder = new TextEncoder();
                    const data = encoder.encode(password + 'LUMU_SALT_' + Date.now());
                    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
                    const hashArray = Array.from(new Uint8Array(hashBuffer));
                    return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                } catch (error) {
                    console.error('Ошибка хеширования пароля:', error);
                    // Fallback для браузеров без crypto.subtle
                    let hash = 0;
                    for (let i = 0; i < password.length; i++) {
                        const char = password.charCodeAt(i);
                        hash = ((hash << 5) - hash) + char;
                        hash = hash & hash;
                    }
                    return Math.abs(hash).toString(16);
                }
            },
            
            // Валидация ввода
            validateInput: function(text, options = {}) {
                const defaults = {
                    maxLength: 1000,
                    minLength: 1,
                    allowHtml: false,
                    allowScript: false
                };
                const config = { ...defaults, ...options };
                
                if (typeof text !== 'string') return false;
                
                // Проверка длины
                if (text.length < config.minLength || text.length > config.maxLength) {
                    return false;
                }
                
                // Проверка на опасные конструкции
                if (!config.allowScript) {
                    const scriptPattern = /<script|javascript:|on\w+\s*=|eval\(|alert\(|document\.|window\./gi;
                    if (scriptPattern.test(text)) {
                        return false;
                    }
                }
                
                // Проверка на SQL-инъекции (базовая)
                const sqlPattern = /(\b(SELECT|INSERT|UPDATE|DELETE|DROP|UNION|EXEC)\b)|(--)|(;)/gi;
                if (sqlPattern.test(text)) {
                    return false;
                }
                
                return true;
            }
        };

        // Состояние приложения
        const AppState = {
            currentUser: null,
            currentChat: null,
            chats: [],
            users: [],
            registeredIPs: {},
            isProcessing: false,
            eventListeners: [] // Для отслеживания и очистки обработчиков
        };

        // DOM элементы
        let elements = {};

        // Информация о пользователе
        const UserInfo = {
            ip: 'unknown',
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            language: navigator.language || navigator.userLanguage
        };

        // Конфигурация
        const Config = {
            UKRAINIAN_IP_PREFIXES: ['31.41.', '37.73.', '46.118.', '46.133.', '46.150.', '46.158.'],
            UKRAINIAN_TIMEZONES: ['Europe/Kiev', 'Europe/Uzhgorod', 'Europe/Zaporozhye'],
            UKRAINIAN_LANGUAGES: ['uk', 'uk-UA'],
            MAX_ACCOUNTS_PER_IP: 1,
            MAX_MESSAGE_LENGTH: 2000,
            MAX_USERNAME_LENGTH: 20,
            MIN_USERNAME_LENGTH: 3,
            MAX_PASSWORD_LENGTH: 100,
            MIN_PASSWORD_LENGTH: 6
        };

        // Утилиты для работы с DOM
        const DOMUtils = {
            getElement: function(id) {
                const element = document.getElementById(id);
                if (!element) {
                    console.warn(`Элемент с ID "${id}" не найден`);
                }
                return element;
            },
            
            getAllElements: function() {
                const ids = [
                    'banScreen', 'authScreen', 'appScreen',
                    'loginForm', 'registerForm', 'loginButton', 'registerButton',
                    'messageInput', 'sendButton', 'messagesContainer',
                    'chatsList', 'newChatBtn', 'logoutBtn',
                    'userAvatar', 'username', 'userIP',
                    'currentChatTitle', 'currentChatDate', 'charCounter'
                ];
                
                ids.forEach(id => {
                    elements[id] = this.getElement(id);
                });
            },
            
            showError: function(elementId, message) {
                const errorElement = this.getElement(elementId);
                if (errorElement) {
                    errorElement.textContent = message;
                    errorElement.classList.add('show');
                }
            },
            
            hideError: function(elementId) {
                const errorElement = this.getElement(elementId);
                if (errorElement) {
                    errorElement.textContent = '';
                    errorElement.classList.remove('show');
                }
            },
            
            disableButton: function(button, text = '') {
                if (button) {
                    button.disabled = true;
                    if (text) {
                        const originalText = button.dataset.originalText || button.textContent;
                        button.dataset.originalText = originalText;
                        button.textContent = text;
                    }
                }
            },
            
            enableButton: function(button) {
                if (button) {
                    button.disabled = false;
                    if (button.dataset.originalText) {
                        button.textContent = button.dataset.originalText;
                        delete button.dataset.originalText;
                    }
                }
            },
            
            clearForm: function(formId) {
                const form = this.getElement(formId);
                if (form) {
                    form.reset();
                    // Скрываем все ошибки в форме
                    const errorElements = form.querySelectorAll('.input-error');
                    errorElements.forEach(el => {
                        el.textContent = '';
                        el.classList.remove('show');
                    });
                }
            }
        };

        // Инициализация
        async function init() {
            console.log('Инициализация приложения...');
            
            // Получаем все DOM элементы
            DOMUtils.getAllElements();
            
            // Получаем реальный IP (для демо используем генерацию)
            await detectIP();
            
            // Проверка на бан
            if (checkForBan()) {
                console.log('Пользователь забанен');
                showBanScreen();
                return;
            }
            
            // Загрузка данных из localStorage
            loadData();
            
            // Проверка активной сессии
            const activeUser = localStorage.getItem('lum_active_user');
            if (activeUser) {
                console.log('Найдена активная сессия:', activeUser);
                const user = AppState.users.find(u => u.username === activeUser);
                if (user) {
                    console.log('Автовход пользователя:', user.username);
                    await loginUser(user);
                }
            }
            
            // Настройка обработчиков событий
            setupEventListeners();
            
            console.log('Приложение инициализировано');
        }

        // Определение IP
        async function detectIP() {
            try {
                // Пытаемся получить реальный IP
                const response = await fetch('https://api.ipify.org?format=json', {
                    timeout: 3000
                });
                if (response.ok) {
                    const data = await response.json();
                    UserInfo.ip = data.ip;
                } else {
                    throw new Error('API недоступно');
                }
            } catch (error) {
                // Fallback: генерация IP для демо
                console.log('Используется сгенерированный IP');
                UserInfo.ip = generateIP();
            }
        }

        // Генерация IP (для демо)
        function generateIP() {
            const prefixes = ['192.168.', '10.0.', '172.16.', '185.100.', '195.220.'];
            const prefix = prefixes[Math.floor(Math.random() * prefixes.length)];
            return prefix + 
                   Math.floor(Math.random() * 255) + '.' + 
                   Math.floor(Math.random() * 255);
        }

        // Загрузка данных
        function loadData() {
            try {
                const usersData = localStorage.getItem('lum_users');
                AppState.users = usersData ? JSON.parse(usersData) : [];
                
                const ipsData = localStorage.getItem('lum_registered_ips');
                AppState.registeredIPs = ipsData ? JSON.parse(ipsData) : {};
                
                console.log('Загружено пользователей:', AppState.users.length);
                console.log('Зарегистрированные IP:', Object.keys(AppState.registeredIPs).length);
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                AppState.users = [];
                AppState.registeredIPs = {};
            }
        }

        // Сохранение данных
        function saveData() {
            try {
                localStorage.setItem('lum_users', JSON.stringify(AppState.users));
                localStorage.setItem('lum_registered_ips', JSON.stringify(AppState.registeredIPs));
                
                if (AppState.currentUser) {
                    localStorage.setItem(`lum_chats_${AppState.currentUser.username}`, JSON.stringify(AppState.chats));
                }
            } catch (error) {
                console.error('Ошибка сохранения данных:', error);
                showAuthMessage('Ошибка сохранения данных', 'error');
            }
        }

        // Проверка на бан
        function checkForBan() {
            let isBanned = false;
            
            // Проверка IP
            for (const prefix of Config.UKRAINIAN_IP_PREFIXES) {
                if (UserInfo.ip.startsWith(prefix)) {
                    isBanned = true;
                    break;
                }
            }
            
            // Проверка часового пояса
            if (Config.UKRAINIAN_TIMEZONES.includes(UserInfo.timezone)) {
                isBanned = true;
            }
            
            // Проверка языка
            for (const lang of Config.UKRAINIAN_LANGUAGES) {
                if (UserInfo.language.toLowerCase().startsWith(lang.toLowerCase())) {
                    isBanned = true;
                    break;
                }
            }
            
            if (isBanned) {
                showBanDetails();
            }
            
            return isBanned;
        }

        // Показать детали бана
        function showBanDetails() {
            const bannedIP = DOMUtils.getElement('bannedIP');
            const bannedTimezone = DOMUtils.getElement('bannedTimezone');
            const bannedLanguage = DOMUtils.getElement('bannedLanguage');
            
            if (bannedIP) bannedIP.textContent = UserInfo.ip;
            if (bannedTimezone) bannedTimezone.textContent = UserInfo.timezone;
            if (bannedLanguage) bannedLanguage.textContent = UserInfo.language;
        }

        // Показать экран бана
        function showBanScreen() {
            if (elements.banScreen) elements.banScreen.classList.remove('hidden');
            if (elements.authScreen) elements.authScreen.classList.add('hidden');
            if (elements.appScreen) elements.appScreen.classList.add('hidden');
        }

        // Настройка обработчиков событий
        function setupEventListeners() {
            console.log('Настройка обработчиков событий...');
            
            // Очистка старых обработчиков
            removeAllEventListeners();
            
            // Переключение табов авторизации
            const authTabs = document.querySelectorAll('.auth-tab');
            authTabs.forEach(tab => {
                const handler = (e) => {
                    const tabName = e.target.dataset.tab;
                    console.log('Переключение на таб:', tabName);
                    switchAuthTab(tabName);
                };
                tab.addEventListener('click', handler);
                AppState.eventListeners.push({ element: tab, type: 'click', handler });
            });

            // Вход
            if (elements.loginForm) {
                const handler = (e) => {
                    e.preventDefault();
                    console.log('Отправка формы входа');
                    handleLogin();
                };
                elements.loginForm.addEventListener('submit', handler);
                AppState.eventListeners.push({ 
                    element: elements.loginForm, 
                    type: 'submit', 
                    handler 
                });
            }

            // Регистрация
            if (elements.registerForm) {
                const handler = (e) => {
                    e.preventDefault();
                    console.log('Отправка формы регистрации');
                    handleRegister();
                };
                elements.registerForm.addEventListener('submit', handler);
                AppState.eventListeners.push({ 
                    element: elements.registerForm, 
                    type: 'submit', 
                    handler 
                });
            }

            // Отправка сообщения
            if (elements.sendButton) {
                const handler = sendMessage;
                elements.sendButton.addEventListener('click', handler);
                AppState.eventListeners.push({ 
                    element: elements.sendButton, 
                    type: 'click', 
                    handler 
                });
            }
            
            // Ввод сообщения
            if (elements.messageInput) {
                const keydownHandler = (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        sendMessage();
                    }
                };
                
                const inputHandler = () => {
                    autoResizeTextarea();
                    updateCharCounter();
                    validateMessageInput();
                };
                
                elements.messageInput.addEventListener('keydown', keydownHandler);
                elements.messageInput.addEventListener('input', inputHandler);
                
                AppState.eventListeners.push(
                    { element: elements.messageInput, type: 'keydown', handler: keydownHandler },
                    { element: elements.messageInput, type: 'input', handler: inputHandler }
                );
            }

            // Новый чат
            if (elements.newChatBtn) {
                const handler = createNewChat;
                elements.newChatBtn.addEventListener('click', handler);
                AppState.eventListeners.push({ 
                    element: elements.newChatBtn, 
                    type: 'click', 
                    handler 
                });
            }

            // Выход
            if (elements.logoutBtn) {
                const handler = logoutUser;
                elements.logoutBtn.addEventListener('click', handler);
                AppState.eventListeners.push({ 
                    element: elements.logoutBtn, 
                    type: 'click', 
                    handler 
                });
            }

            // Валидация форм в реальном времени
            setupRealTimeValidation();

            console.log('Обработчики событий настроены');
        }

        // Настройка валидации в реальном времени
        function setupRealTimeValidation() {
            const inputs = document.querySelectorAll('input[required], textarea[required]');
            inputs.forEach(input => {
                const handler = () => {
                    validateField(input);
                };
                input.addEventListener('blur', handler);
                AppState.eventListeners.push({ element: input, type: 'blur', handler });
            });
        }

        // Валидация поля
        function validateField(input) {
            const value = input.value.trim();
            const id = input.id;
            const errorId = id + 'Error';
            
            DOMUtils.hideError(errorId);
            
            // Проверка на пустое значение
            if (!value && input.required) {
                DOMUtils.showError(errorId, 'Это поле обязательно для заполнения');
                return false;
            }
            
            // Специфичные проверки
            if (id.includes('Username')) {
                if (value.length < Config.MIN_USERNAME_LENGTH) {
                    DOMUtils.showError(errorId, `Ник должен быть не менее ${Config.MIN_USERNAME_LENGTH} символов`);
                    return false;
                }
                if (value.length > Config.MAX_USERNAME_LENGTH) {
                    DOMUtils.showError(errorId, `Ник должен быть не более ${Config.MAX_USERNAME_LENGTH} символов`);
                    return false;
                }
                // Проверка на допустимые символы
                const usernameRegex = /^[a-zA-Z0-9_\-]+$/;
                if (!usernameRegex.test(value)) {
                    DOMUtils.showError(errorId, 'Ник может содержать только буквы, цифры, дефисы и подчеркивания');
                    return false;
                }
            }
            
            if (id.includes('Password')) {
                if (value.length < Config.MIN_PASSWORD_LENGTH) {
                    DOMUtils.showError(errorId, `Пароль должен быть не менее ${Config.MIN_PASSWORD_LENGTH} символов`);
                    return false;
                }
                if (value.length > Config.MAX_PASSWORD_LENGTH) {
                    DOMUtils.showError(errorId, `Пароль должен быть не более ${Config.MAX_PASSWORD_LENGTH} символов`);
                    return false;
                }
            }
            
            if (id === 'registerConfirmPassword') {
                const password = DOMUtils.getElement('registerPassword')?.value || '';
                if (value !== password) {
                    DOMUtils.showError(errorId, 'Пароли не совпадают');
                    return false;
                }
            }
            
            return true;
        }

        // Удаление всех обработчиков событий
        function removeAllEventListeners() {
            AppState.eventListeners.forEach(({ element, type, handler }) => {
                if (element && handler) {
                    element.removeEventListener(type, handler);
                }
            });
            AppState.eventListeners = [];
        }

        // Переключение табов авторизации
        function switchAuthTab(tabName) {
            document.querySelectorAll('.auth-tab').forEach(tab => {
                const isActive = tab.dataset.tab === tabName;
                tab.classList.toggle('active', isActive);
            });

            if (elements.loginForm) {
                elements.loginForm.classList.toggle('hidden', tabName !== 'login');
            }
            
            if (elements.registerForm) {
                elements.registerForm.classList.toggle('hidden', tabName !== 'register');
            }
            
            // Очистка сообщений и форм
            clearAuthMessages();
            DOMUtils.clearForm(tabName === 'login' ? 'loginForm' : 'registerForm');
        }

        // Очистка сообщений авторизации
        function clearAuthMessages() {
            const loginMsg = DOMUtils.getElement('loginMessage');
            const registerMsg = DOMUtils.getElement('registerMessage');
            
            if (loginMsg) {
                loginMsg.textContent = '';
                loginMsg.className = 'auth-message';
            }
            
            if (registerMsg) {
                registerMsg.textContent = '';
                registerMsg.className = 'auth-message';
            }
        }

        // Показать сообщение авторизации
        function showAuthMessage(text, type, formType = 'login') {
            const elementId = formType === 'login' ? 'loginMessage' : 'registerMessage';
            const element = DOMUtils.getElement(elementId);
            if (element) {
                element.textContent = text;
                element.className = `auth-message ${type}`;
            }
        }

        // Обработка входа
        async function handleLogin() {
            if (AppState.isProcessing) return;
            
            AppState.isProcessing = true;
            const loginButton = DOMUtils.getElement('loginButton');
            if (!loginButton) return;
            
            DOMUtils.disableButton(loginButton, 'Вход...');
            
            const usernameInput = DOMUtils.getElement('loginUsername');
            const passwordInput = DOMUtils.getElement('loginPassword');
            
            if (!usernameInput || !passwordInput) {
                DOMUtils.enableButton(loginButton);
                AppState.isProcessing = false;
                return;
            }
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            console.log('Попытка входа:', username);

            // Валидация полей
            if (!validateField(usernameInput) || !validateField(passwordInput)) {
                DOMUtils.enableButton(loginButton);
                AppState.isProcessing = false;
                return;
            }

            try {
                // Хеширование пароля для сравнения
                const hashedPassword = await SecurityUtils.hashPassword(password);
                
                // Поиск пользователя
                const user = AppState.users.find(u => 
                    u.username === username && u.passwordHash === hashedPassword
                );
                
                // Имитация задержки сети
                await delay(500 + Math.random() * 500);
                
                if (user) {
                    console.log('Пользователь найден:', user.username);
                    await loginUser(user);
                } else {
                    console.log('Пользователь не найден или неверный пароль');
                    showAuthMessage('Неверный логин или пароль', 'error', 'login');
                    DOMUtils.enableButton(loginButton);
                }
            } catch (error) {
                console.error('Ошибка входа:', error);
                showAuthMessage('Ошибка входа. Попробуйте позже.', 'error', 'login');
                DOMUtils.enableButton(loginButton);
            }
            
            AppState.isProcessing = false;
        }

        // Обработка регистрации
        async function handleRegister() {
            if (AppState.isProcessing) return;
            
            AppState.isProcessing = true;
            const registerButton = DOMUtils.getElement('registerButton');
            if (!registerButton) return;
            
            DOMUtils.disableButton(registerButton, 'Регистрация...');
            
            const usernameInput = DOMUtils.getElement('registerUsername');
            const passwordInput = DOMUtils.getElement('registerPassword');
            const confirmPasswordInput = DOMUtils.getElement('registerConfirmPassword');
            
            if (!usernameInput || !passwordInput || !confirmPasswordInput) {
                DOMUtils.enableButton(registerButton);
                AppState.isProcessing = false;
                return;
            }
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;
            
            console.log('Попытка регистрации:', username);

            try {
                // Валидация всех полей
                const isValid = [usernameInput, passwordInput, confirmPasswordInput]
                    .map(input => validateField(input))
                    .every(result => result === true);
                
                if (!isValid) {
                    DOMUtils.enableButton(registerButton);
                    AppState.isProcessing = false;
                    return;
                }

                // Проверка на существующий ник
                if (AppState.users.some(u => u.username === username)) {
                    showAuthMessage('Этот ник уже занят', 'error', 'register');
                    DOMUtils.enableButton(registerButton);
                    AppState.isProcessing = false;
                    return;
                }

                // Проверка лимита аккаунтов с IP
                const ipCount = AppState.registeredIPs[UserInfo.ip] || 0;
                if (ipCount >= Config.MAX_ACCOUNTS_PER_IP) {
                    showAuthMessage('С этого IP уже зарегистрирован аккаунт', 'error', 'register');
                    DOMUtils.enableButton(registerButton);
                    AppState.isProcessing = false;
                    return;
                }

                // Хеширование пароля
                const passwordHash = await SecurityUtils.hashPassword(password);
                
                // Создание пользователя
                const user = {
                    username,
                    passwordHash, // Сохраняем только хеш
                    ip: UserInfo.ip,
                    timezone: UserInfo.timezone,
                    language: UserInfo.language,
                    createdAt: new Date().toISOString(),
                    lastLogin: new Date().toISOString()
                };

                console.log('Создание нового пользователя:', user.username);

                // Сохранение пользователя
                AppState.users.push(user);
                AppState.registeredIPs[UserInfo.ip] = (AppState.registeredIPs[UserInfo.ip] || 0) + 1;
                
                // Имитация задержки сети
                await delay(500 + Math.random() * 500);
                
                // Сохранение данных
                saveData();
                
                showAuthMessage('Регистрация успешна! Выполняется вход...', 'success', 'register');
                
                // Автоматический вход
                setTimeout(async () => {
                    await loginUser(user);
                }, 1000);
                
            } catch (error) {
                console.error('Ошибка регистрации:', error);
                showAuthMessage('Ошибка регистрации. Попробуйте позже.', 'error', 'register');
                DOMUtils.enableButton(registerButton);
                AppState.isProcessing = false;
            }
        }

        // Вход пользователя
        async function loginUser(user) {
            try {
                console.log('Выполняется вход пользователя:', user.username);
                
                AppState.currentUser = user;
                AppState.isProcessing = false;
                user.lastLogin = new Date().toISOString();
                
                // Сохранение активной сессии
                localStorage.setItem('lum_active_user', user.username);
                
                // Загрузка чатов пользователя
                loadUserChats();
                
                // Обновление UI
                updateUserDisplay();
                
                // Переключение экранов
                if (elements.authScreen) elements.authScreen.classList.add('hidden');
                if (elements.appScreen) elements.appScreen.classList.remove('hidden');
                
                // Создание первого чата, если нет
                if (AppState.chats.length === 0) {
                    createNewChat();
                }
                
                // Сброс кнопок
                const loginButton = DOMUtils.getElement('loginButton');
                const registerButton = DOMUtils.getElement('registerButton');
                if (loginButton) DOMUtils.enableButton(loginButton);
                if (registerButton) DOMUtils.enableButton(registerButton);
                
                // Сброс форм
                DOMUtils.clearForm('loginForm');
                DOMUtils.clearForm('registerForm');
                
                console.log('Пользователь вошел:', user.username);
            } catch (error) {
                console.error('Ошибка входа:', error);
                showAuthMessage('Ошибка при входе', 'error', 'login');
            }
        }

        // Загрузка чатов пользователя
        function loadUserChats() {
            if (!AppState.currentUser) return;
            
            try {
                const savedChats = localStorage.getItem(`lum_chats_${AppState.currentUser.username}`);
                AppState.chats = savedChats ? JSON.parse(savedChats) : [];
                renderChatsList();
            } catch (error) {
                console.error('Ошибка загрузки чатов:', error);
                AppState.chats = [];
            }
        }

        // Выход пользователя
        function logoutUser() {
            if (confirm('Вы уверены, что хотите выйти?')) {
                console.log('Выход пользователя:', AppState.currentUser?.username);
                
                AppState.currentUser = null;
                AppState.currentChat = null;
                localStorage.removeItem('lum_active_user');
                
                // Очистка форм
                DOMUtils.clearForm('loginForm');
                DOMUtils.clearForm('registerForm');
                
                // Переключение на экран авторизации
                if (elements.appScreen) elements.appScreen.classList.add('hidden');
                if (elements.authScreen) elements.authScreen.classList.remove('hidden');
                switchAuthTab('login');
                clearAuthMessages();
                
                console.log('Пользователь вышел');
            }
        }

        // Обновление отображения пользователя
        function updateUserDisplay() {
            if (!AppState.currentUser || !elements.userAvatar || !elements.username || !elements.userIP) return;
            
            const firstLetter = AppState.currentUser.username.charAt(0).toUpperCase();
            elements.userAvatar.textContent = firstLetter;
            elements.username.textContent = SecurityUtils.escapeHtml(AppState.currentUser.username);
            elements.userIP.textContent = `IP: ${SecurityUtils.escapeHtml(AppState.currentUser.ip)}`;
        }

        // Создание нового чата
        function createNewChat() {
            console.log('Создание нового чата');
            
            const chatId = Date.now().toString();
            const chat = {
                id: chatId,
                title: 'Новый чат',
                messages: [],
                createdAt: new Date().toISOString(),
                lastMessage: null
            };
            
            AppState.chats.unshift(chat);
            AppState.currentChat = chat;
            
            saveData();
            renderChatsList();
            renderChat();
        }

        // Рендер списка чатов
        function renderChatsList() {
            if (!elements.chatsList) return;
            
            // Используем DocumentFragment для оптимизации
            const fragment = document.createDocumentFragment();
            
            AppState.chats.forEach(chat => {
                const chatElement = document.createElement('div');
                chatElement.className = `chat-item ${AppState.currentChat?.id === chat.id ? 'active' : ''}`;
                chatElement.dataset.chatId = chat.id;
                
                const title = document.createElement('div');
                title.textContent = SecurityUtils.escapeHtml(chat.title);
                chatElement.appendChild(title);
                
                if (chat.lastMessage) {
                    const preview = document.createElement('div');
                    preview.className = 'chat-preview';
                    preview.textContent = SecurityUtils.escapeHtml(chat.lastMessage);
                    chatElement.appendChild(preview);
                }
                
                const handler = () => {
                    AppState.currentChat = chat;
                    renderChatsList();
                    renderChat();
                };
                
                chatElement.addEventListener('click', handler);
                AppState.eventListeners.push({ element: chatElement, type: 'click', handler });
                
                fragment.appendChild(chatElement);
            });
            
            // Очистка и добавление
            elements.chatsList.innerHTML = '';
            elements.chatsList.appendChild(fragment);
        }

        // Рендер чата
        function renderChat() {
            if (!AppState.currentChat || !elements.messagesContainer || !elements.currentChatTitle || !elements.currentChatDate) return;
            
            // Используем DocumentFragment
            const fragment = document.createDocumentFragment();
            
            // Приветственное сообщение только для пустого чата
            if (AppState.currentChat.messages.length === 0) {
                const welcomeMsg = document.createElement('div');
                welcomeMsg.className = 'welcome-message';
                
                const icon = document.createElement('div');
                icon.className = 'welcome-icon';
                icon.innerHTML = '<i class="fas fa-robot"></i>';
                
                const title = document.createElement('div');
                title.className = 'welcome-title';
                title.textContent = 'LUMU';
                
                const text = document.createElement('div');
                text.className = 'welcome-text';
                text.textContent = 'Чем могу вам помочь?';
                
                welcomeMsg.appendChild(icon);
                welcomeMsg.appendChild(title);
                welcomeMsg.appendChild(text);
                fragment.appendChild(welcomeMsg);
            } else {
                // Сообщения чата
                AppState.currentChat.messages.forEach(msg => {
                    const messageElement = createMessageElement(msg.text, msg.sender, msg.timestamp);
                    fragment.appendChild(messageElement);
                });
            }
            
            // Очистка и добавление
            elements.messagesContainer.innerHTML = '';
            elements.messagesContainer.appendChild(fragment);
            
            // Обновление заголовка
            elements.currentChatTitle.textContent = SecurityUtils.escapeHtml(AppState.currentChat.title);
            elements.currentChatDate.textContent = formatDate(AppState.currentChat.createdAt);
            
            scrollToBottom();
        }

        // Создание элемента сообщения
        function createMessageElement(text, sender, timestamp) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message message-${sender}`;
            
            const textDiv = document.createElement('div');
            textDiv.textContent = SecurityUtils.escapeHtml(text);
            messageDiv.appendChild(textDiv);
            
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = timestamp;
            messageDiv.appendChild(timeDiv);
            
            return messageDiv;
        }

        // Валидация ввода сообщения
        function validateMessageInput() {
            const input = elements.messageInput;
            const errorElement = DOMUtils.getElement('messageInputError');
            const sendButton = elements.sendButton;
            
            if (!input || !errorElement || !sendButton) return false;
            
            const text = input.value.trim();
            
            // Очистка предыдущей ошибки
            DOMUtils.hideError('messageInputError');
            
            // Проверка на пустое сообщение
            if (text.length === 0) {
                sendButton.disabled = true;
                return false;
            }
            
            // Проверка на максимальную длину
            if (text.length > Config.MAX_MESSAGE_LENGTH) {
                DOMUtils.showError('messageInputError', `Сообщение не должно превышать ${Config.MAX_MESSAGE_LENGTH} символов`);
                sendButton.disabled = true;
                return false;
            }
            
            // Проверка безопасности
            if (!SecurityUtils.validateInput(text, { maxLength: Config.MAX_MESSAGE_LENGTH })) {
                DOMUtils.showError('messageInputError', 'Сообщение содержит недопустимые символы');
                sendButton.disabled = true;
                return false;
            }
            
            // Все проверки пройдены
            sendButton.disabled = false;
            return true;
        }

        // Обновление счетчика символов
        function updateCharCounter() {
            const counter = elements.charCounter;
            const input = elements.messageInput;
            
            if (!counter || !input) return;
            
            const length = input.value.length;
            counter.textContent = `${length}/${Config.MAX_MESSAGE_LENGTH}`;
            
            // Изменение цвета в зависимости от длины
            counter.classList.remove('warning', 'error');
            if (length > Config.MAX_MESSAGE_LENGTH * 0.9) {
                counter.classList.add('error');
            } else if (length > Config.MAX_MESSAGE_LENGTH * 0.8) {
                counter.classList.add('warning');
            }
        }

        // Отправка сообщения
        async function sendMessage() {
            if (!validateMessageInput() || !AppState.currentChat || !AppState.currentUser) {
                return;
            }
            
            const input = elements.messageInput;
            if (!input) return;
            
            const text = input.value.trim();
            console.log('Отправка сообщения:', text.substring(0, 50) + '...');
            
            // Добавление сообщения пользователя
            const userMessageElement = createMessageElement(text, 'user', getCurrentTime());
            if (elements.messagesContainer) {
                elements.messagesContainer.appendChild(userMessageElement);
            }
            
            // Сохранение сообщения
            AppState.currentChat.messages.push({
                text: text,
                sender: 'user',
                timestamp: getCurrentTime(),
                fullTimestamp: new Date().toISOString()
            });
            
            // Очистка и сброс поля ввода
            input.value = '';
            autoResizeTextarea();
            updateCharCounter();
            validateMessageInput();
            
            // Обновление информации о чате
            AppState.currentChat.lastMessage = text.length > 50 ? text.substring(0, 47) + '...' : text;
            if (AppState.currentChat.title === 'Новый чат' && text.length > 0) {
                AppState.currentChat.title = text.length > 30 ? text.substring(0, 27) + '...' : text;
            }
            
            // Индикатор набора
            showTypingIndicator();
            
            try {
                // Имитация ответа ИИ с задержкой
                await delay(1000 + Math.random() * 1000);
                
                removeTypingIndicator();
                
                const aiResponse = generateAIResponse(text);
                const aiMessageElement = createMessageElement(aiResponse, 'ai', getCurrentTime());
                if (elements.messagesContainer) {
                    elements.messagesContainer.appendChild(aiMessageElement);
                }
                
                // Сохранение ответа ИИ
                AppState.currentChat.messages.push({
                    text: aiResponse,
                    sender: 'ai',
                    timestamp: getCurrentTime(),
                    fullTimestamp: new Date().toISOString()
                });
                
                // Сохранение и обновление UI
                saveData();
                renderChatsList();
                scrollToBottom();
                
            } catch (error) {
                console.error('Ошибка при получении ответа ИИ:', error);
                removeTypingIndicator();
                
                // Сообщение об ошибке
                const errorMessage = "Извините, произошла ошибка. Пожалуйста, попробуйте еще раз.";
                const errorElement = createMessageElement(errorMessage, 'ai', getCurrentTime());
                if (elements.messagesContainer) {
                    elements.messagesContainer.appendChild(errorElement);
                }
                
                AppState.currentChat.messages.push({
                    text: errorMessage,
                    sender: 'ai',
                    timestamp: getCurrentTime(),
                    fullTimestamp: new Date().toISOString()
                });
                
                saveData();
                scrollToBottom();
            }
        }

        // Генерация ответа ИИ
        function generateAIResponse(userMessage) {
            const responses = [
                "Я помогу вам с этим вопросом. Можете уточнить детали?",
                "Интересный вопрос! Давайте разберем его подробнее.",
                "На основе предоставленной информации, я могу сказать следующее...",
                "Для решения этой задачи рекомендую рассмотреть несколько вариантов...",
                "Это распространенный запрос. Вот что я могу предложить...",
                "Чтобы дать точный ответ, мне нужно больше информации по этой теме.",
                "Спасибо за ваш вопрос! Я проанализировал данные и готов поделиться выводом.",
                "По моим данным, оптимальным решением будет...",
                "Давайте рассмотрим этот вопрос с разных сторон.",
                "Я изучил ваш запрос и подготовил подробный ответ."
            ];
            
            // Простой алгоритм выбора ответа на основе длины вопроса
            const index = Math.min(Math.floor(userMessage.length / 20), responses.length - 1);
            return responses[index];
        }

        // Индикатор набора
        function showTypingIndicator() {
            if (!elements.messagesContainer) return;
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.id = 'typingIndicator';
            typingDiv.innerHTML = `
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            `;
            elements.messagesContainer.appendChild(typingDiv);
            scrollToBottom();
        }

        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // Авторазмер текстового поля
        function autoResizeTextarea() {
            if (!elements.messageInput) return;
            
            elements.messageInput.style.height = 'auto';
            const newHeight = Math.min(elements.messageInput.scrollHeight, 120);
            elements.messageInput.style.height = newHeight + 'px';
        }

        // Прокрутка вниз
        function scrollToBottom() {
            if (!elements.messagesContainer) return;
            
            requestAnimationFrame(() => {
                elements.messagesContainer.scrollTop = elements.messagesContainer.scrollHeight;
            });
        }

        // Получение текущего времени
        function getCurrentTime() {
            return new Date().toLocaleTimeString('ru-RU', { 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        // Форматирование даты
        function formatDate(isoString) {
            try {
                const date = new Date(isoString);
                return date.toLocaleDateString('ru-RU', {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                });
            } catch (error) {
                console.error('Ошибка форматирования даты:', error);
                return '';
            }
        }

        // Задержка (для имитации сети)
        function delay(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Запуск приложения
        window.addEventListener('DOMContentLoaded', init);
        
        // Очистка при закрытии страницы
        window.addEventListener('beforeunload', () => {
            removeAllEventListeners();
        });
    </script>
</body>
</html>
