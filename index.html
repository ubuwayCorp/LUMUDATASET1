<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUMU AI Chat</title>
    <style>
        :root {
            --dark-gray: #1a1a1a;
            --medium-gray: #2d2d2d;
            --light-gray: #3d3d3d;
            --text-white: #ffffff;
            --text-light: #cccccc;
            --accent: #4a4a4a;
            --border: #333333;
            --error: #ff6b6b;
            --success: #4caf50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: var(--dark-gray);
            color: var(--text-white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            max-width: 1200px;
            height: 95vh;
            background: var(--medium-gray);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Аутентификация */
        .auth-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-box {
            background: var(--light-gray);
            padding: 40px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--border);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo {
            font-size: 48px;
            font-weight: 800;
            color: var(--text-white);
            margin-bottom: 10px;
        }

        .auth-title {
            font-size: 24px;
            color: var(--text-white);
            margin-bottom: 30px;
        }

        .auth-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: var(--medium-gray);
            border: none;
            border-radius: 8px;
            color: var(--text-light);
            cursor: pointer;
            font-size: 16px;
        }

        .tab-btn.active {
            background: var(--accent);
            color: var(--text-white);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-light);
        }

        .form-input {
            width: 100%;
            padding: 12px;
            background: var(--dark-gray);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-white);
            font-size: 16px;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--text-light);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--text-white);
            color: var(--dark-gray);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .error-message {
            color: var(--error);
            margin-top: 10px;
            font-size: 14px;
            text-align: center;
        }

        /* Чат */
        .chat-container {
            width: 100%;
            height: 100%;
            display: none;
            flex-direction: column;
        }

        .chat-header {
            padding: 20px;
            background: var(--light-gray);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-white);
            font-size: 20px;
            cursor: pointer;
            padding: 8px;
            border-radius: 6px;
        }

        .menu-btn:hover {
            background: rgba(255,255,255,0.1);
        }

        .chat-main {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            background: var(--medium-gray);
        }

        .welcome-message {
            text-align: center;
            margin-bottom: 40px;
        }

        .welcome-title {
            font-size: 42px;
            font-weight: 300;
            color: var(--text-white);
            margin-bottom: 10px;
        }

        .welcome-subtitle {
            font-size: 18px;
            color: var(--text-light);
        }

        .message {
            max-width: 70%;
            padding: 15px 20px;
            border-radius: 18px;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .user-message {
            background: var(--accent);
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .ai-message {
            background: var(--light-gray);
            border-bottom-left-radius: 5px;
        }

        .chat-input-area {
            padding: 20px;
            background: var(--light-gray);
            border-top: 1px solid var(--border);
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .attach-btn {
            width: 40px;
            height: 40px;
            background: var(--accent);
            border: none;
            border-radius: 50%;
            color: var(--text-white);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-input {
            flex: 1;
            padding: 14px 20px;
            background: var(--dark-gray);
            border: 1px solid var(--border);
            border-radius: 24px;
            color: var(--text-white);
            font-size: 16px;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            background: var(--text-white);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--dark-gray);
        }

        /* Боковое меню */
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background: var(--medium-gray);
            transition: left 0.3s;
            z-index: 100;
            padding: 20px;
            border-right: 1px solid var(--border);
        }

        .sidebar.active {
            left: 0;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            z-index: 99;
        }

        .overlay.active {
            display: block;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .sidebar-title {
            font-size: 20px;
            color: var(--text-white);
        }

        .close-sidebar {
            background: none;
            border: none;
            color: var(--text-white);
            font-size: 20px;
            cursor: pointer;
        }

        .sidebar-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 14px;
            color: var(--text-light);
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .sidebar-btn {
            width: 100%;
            padding: 12px;
            background: var(--light-gray);
            border: none;
            border-radius: 8px;
            color: var(--text-white);
            text-align: left;
            cursor: pointer;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .sidebar-input {
            width: 100%;
            padding: 10px;
            background: var(--dark-gray);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-white);
            margin-bottom: 10px;
        }

        .profile-info {
            margin-top: auto;
            padding: 15px;
            background: var(--light-gray);
            border-radius: 8px;
        }

        .profile-name {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .profile-ip {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 5px;
        }

        .status {
            display: inline-block;
            padding: 3px 8px;
            background: var(--dark-gray);
            border-radius: 4px;
            font-size: 12px;
        }

        .status.free {
            color: #ccc;
        }

        .logout-btn {
            width: 100%;
            padding: 12px;
            background: var(--light-gray);
            border: none;
            border-radius: 8px;
            color: var(--text-white);
            margin-top: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- Экран аутентификации -->
        <div class="auth-container" id="authScreen">
            <div class="auth-box">
                <div class="auth-header">
                    <div class="auth-logo">LUMU</div>
                    <h2 class="auth-title">Выберите действие</h2>
                </div>

                <div class="auth-tabs">
                    <button class="tab-btn active" id="loginTab">Вход</button>
                    <button class="tab-btn" id="registerTab">Регистрация</button>
                </div>

                <!-- Форма входа -->
                <form class="auth-form active" id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Ник</label>
                        <input type="text" class="form-input" id="loginUsername" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-input" id="loginPassword" required>
                    </div>

                    <button type="submit" class="submit-btn">Войти</button>
                    <div class="error-message" id="loginError"></div>
                </form>

                <!-- Форма регистрации -->
                <form class="auth-form" id="registerForm">
                    <div class="form-group">
                        <label class="form-label">Придумайте ник</label>
                        <input type="text" class="form-input" id="regUsername" required minlength="3">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-input" id="regPassword" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Повторите пароль</label>
                        <input type="password" class="form-input" id="regConfirmPassword" required>
                    </div>

                    <button type="submit" class="submit-btn">Зарегистрироваться</button>
                    <div class="error-message" id="registerError"></div>
                </form>
            </div>
        </div>

        <!-- Экран чата -->
        <div class="chat-container" id="chatScreen">
            <!-- Шапка чата -->
            <div class="chat-header">
                <button class="menu-btn" id="menuBtn">
                    ☰
                </button>
                <div class="chat-title">LUMU AI</div>
                <div style="width: 40px;"></div>
            </div>

            <!-- Основная область чата -->
            <div class="chat-main" id="chatMain">
                <div class="welcome-message">
                    <h1 class="welcome-title">LUMU</h1>
                    <p class="welcome-subtitle">Чем могу вам помочь сегодня?</p>
                </div>
                
                <div id="messagesContainer"></div>
            </div>

            <!-- Поле ввода -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <button class="attach-btn" id="attachBtn">+</button>
                    <input type="text" class="chat-input" id="chatInput" placeholder="Введите ваш запрос...">
                    <button class="send-btn" id="sendBtn">↑</button>
                </div>
            </div>
        </div>

        <!-- Боковое меню -->
        <div class="overlay" id="overlay"></div>
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3 class="sidebar-title">Меню</h3>
                <button class="close-sidebar" id="closeSidebar">×</button>
            </div>

            <div class="sidebar-section">
                <div class="section-title">Чат</div>
                <button class="sidebar-btn" id="newChatBtn">
                    <span>+ Новый чат</span>
                </button>
            </div>

            <div class="sidebar-section">
                <div class="section-title">Аккаунт</div>
                <button class="sidebar-btn" id="promoBtn">
                    <span>Промокод</span>
                </button>
                <button class="sidebar-btn" id="keysBtn">
                    <span>Ключи</span>
                </button>
            </div>

            <div class="sidebar-section">
                <div class="section-title">Статус</div>
                <div id="statusDisplay" class="status free">FREE</div>
            </div>

            <!-- Секция промокода -->
            <div class="sidebar-section" id="promoSection" style="display: none;">
                <div class="section-title">Промокод</div>
                <input type="text" class="sidebar-input" id="promoInput" placeholder="Введите промокод">
                <button class="sidebar-btn" id="activatePromoBtn">Активировать</button>
                <div id="promoResult" style="color: #ccc; font-size: 14px; margin-top: 10px;"></div>
            </div>

            <!-- Секция ключей -->
            <div class="sidebar-section" id="keysSection" style="display: none;">
                <div class="section-title">Ключ активации</div>
                <input type="text" class="sidebar-input" id="keyInput" placeholder="Введите ключ">
                <button class="sidebar-btn" id="activateKeyBtn">Активировать ключ</button>
                <div id="keyResult" style="color: #ccc; font-size: 14px; margin-top: 10px;"></div>
            </div>

            <!-- Информация профиля -->
            <div class="profile-info">
                <div class="profile-name" id="profileName">Гость</div>
                <div class="profile-ip" id="profileIp">IP: Загрузка...</div>
                <div class="status free" id="userStatus">FREE</div>
            </div>

            <button class="logout-btn" id="logoutBtn">
                <span>Выйти</span>
            </button>
        </div>
    </div>

    <script>
        // Глобальные переменные
        let currentUser = null;
        let userIP = '';
        let messages = [];

        // Инициализация при загрузке
        document.addEventListener('DOMContentLoaded', function() {
            // Генерация IP
            userIP = generateIP();
            
            // Проверка украинского доступа
            if (checkUkrainianAccess()) {
                alert('В связи с СВО доступ с территории Украины ограничен');
                return;
            }

            // Загрузка сохраненного пользователя
            loadUser();

            // Назначение обработчиков событий
            setupEventListeners();

            // Обновление IP в интерфейсе
            document.getElementById('profileIp').textContent = `IP: ${userIP}`;
        });

        // Генерация случайного IP
        function generateIP() {
            return '192.168.' + 
                   Math.floor(Math.random() * 255) + '.' + 
                   Math.floor(Math.random() * 255);
        }

        // Проверка украинского доступа
        function checkUkrainianAccess() {
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            const language = navigator.language || navigator.userLanguage;
            
            const ukrainianIndicators = ['Europe/Kiev', 'Europe/Kyiv', 'UA', 'uk', 'Ukrainian'];
            
            return ukrainianIndicators.some(indicator => 
                timezone.includes(indicator) || 
                language.includes(indicator)
            );
        }

        // Загрузка пользователя из localStorage
        function loadUser() {
            try {
                const savedUser = localStorage.getItem('lumuchat_user');
                const savedIP = localStorage.getItem('lumuchat_ip');
                
                if (savedUser && savedIP === userIP) {
                    currentUser = JSON.parse(savedUser);
                    showChatScreen();
                }
            } catch (e) {
                console.error('Ошибка загрузки пользователя:', e);
                localStorage.removeItem('lumuchat_user');
                localStorage.removeItem('lumuchat_ip');
            }
        }

        // Сохранение пользователя в localStorage
        function saveUser(user) {
            try {
                localStorage.setItem('lumuchat_user', JSON.stringify(user));
                localStorage.setItem('lumuchat_ip', userIP);
                currentUser = user;
            } catch (e) {
                console.error('Ошибка сохранения пользователя:', e);
            }
        }

        // Назначение обработчиков событий
        function setupEventListeners() {
            // Переключение вкладок
            document.getElementById('loginTab').addEventListener('click', () => switchTab('login'));
            document.getElementById('registerTab').addEventListener('click', () => switchTab('register'));

            // Формы
            document.getElementById('loginForm').addEventListener('submit', handleLogin);
            document.getElementById('registerForm').addEventListener('submit', handleRegister);

            // Чат
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            document.getElementById('chatInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') sendMessage();
            });

            // Меню
            document.getElementById('menuBtn').addEventListener('click', openMenu);
            document.getElementById('closeSidebar').addEventListener('click', closeMenu);
            document.getElementById('overlay').addEventListener('click', closeMenu);
            document.getElementById('logoutBtn').addEventListener('click', logout);

            // Боковое меню
            document.getElementById('newChatBtn').addEventListener('click', startNewChat);
            document.getElementById('promoBtn').addEventListener('click', () => showSection('promo'));
            document.getElementById('keysBtn').addEventListener('click', () => showSection('keys'));
            document.getElementById('activatePromoBtn').addEventListener('click', activatePromo);
            document.getElementById('activateKeyBtn').addEventListener('click', activateKey);
        }

        // Переключение вкладок
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');

            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.classList.add('active');
                registerForm.classList.remove('active');
            } else {
                loginTab.classList.remove('active');
                registerTab.classList.add('active');
                loginForm.classList.remove('active');
                registerForm.classList.add('active');
            }

            // Очистка ошибок
            document.getElementById('loginError').textContent = '';
            document.getElementById('registerError').textContent = '';
        }

        // Обработка входа
        function handleLogin(e) {
            e.preventDefault();
            
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorElement = document.getElementById('loginError');

            // Валидация
            if (!username || !password) {
                errorElement.textContent = 'Заполните все поля';
                return;
            }

            // Проверка существующего пользователя
            const savedUser = localStorage.getItem('lumuchat_user');
            if (!savedUser) {
                errorElement.textContent = 'Пользователь не найден';
                return;
            }

            const userData = JSON.parse(savedUser);
            const savedIP = localStorage.getItem('lumuchat_ip');

            // Проверка IP
            if (savedIP !== userIP) {
                errorElement.textContent = 'Доступ только с зарегистрированного IP';
                return;
            }

            // Проверка учетных данных
            if (userData.username !== username || userData.password !== password) {
                errorElement.textContent = 'Неверный логин или пароль';
                return;
            }

            // Успешный вход
            currentUser = userData;
            saveUser(userData);
            showChatScreen();
            errorElement.textContent = '';
        }

        // Обработка регистрации
        function handleRegister(e) {
            e.preventDefault();
            
            const username = document.getElementById('regUsername').value.trim();
            const password = document.getElementById('regPassword').value;
            const confirmPassword = document.getElementById('regConfirmPassword').value;
            const errorElement = document.getElementById('registerError');

            // Валидация
            if (username.length < 3) {
                errorElement.textContent = 'Ник должен быть не менее 3 символов';
                return;
            }

            if (password.length < 6) {
                errorElement.textContent = 'Пароль должен быть не менее 6 символов';
                return;
            }

            if (password !== confirmPassword) {
                errorElement.textContent = 'Пароли не совпадают';
                return;
            }

            // Проверка существующего пользователя
            const savedIP = localStorage.getItem('lumuchat_ip');
            if (savedIP === userIP) {
                errorElement.textContent = 'На этом IP уже есть аккаунт';
                return;
            }

            // Создание пользователя
            const userData = {
                username: username,
                password: password,
                status: 'free',
                createdAt: new Date().toISOString()
            };

            // Сохранение
            saveUser(userData);
            showChatScreen();
            errorElement.textContent = '';
        }

        // Показать экран чата
        function showChatScreen() {
            if (!currentUser) return;

            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('chatScreen').style.display = 'flex';

            // Обновление информации профиля
            document.getElementById('profileName').textContent = currentUser.username;
            document.getElementById('userStatus').textContent = currentUser.status.toUpperCase();
            document.getElementById('statusDisplay').textContent = currentUser.status.toUpperCase();
        }

        // Открыть меню
        function openMenu() {
            document.getElementById('sidebar').classList.add('active');
            document.getElementById('overlay').classList.add('active');
        }

        // Закрыть меню
        function closeMenu() {
            document.getElementById('sidebar').classList.remove('active');
            document.getElementById('overlay').classList.remove('active');
            hideAllSections();
        }

        // Показать секцию в меню
        function showSection(section) {
            hideAllSections();
            
            if (section === 'promo') {
                document.getElementById('promoSection').style.display = 'block';
            } else if (section === 'keys') {
                document.getElementById('keysSection').style.display = 'block';
            }
        }

        // Скрыть все секции
        function hideAllSections() {
            document.getElementById('promoSection').style.display = 'none';
            document.getElementById('keysSection').style.display = 'none';
        }

        // Активация промокода
        function activatePromo() {
            const promo = document.getElementById('promoInput').value.trim();
            const result = document.getElementById('promoResult');

            if (!promo) {
                result.textContent = 'Введите промокод';
                result.style.color = '#ff6b6b';
                return;
            }

            // Генерация ключа
            const key = 'KEY-' + Math.random().toString(36).substring(2, 10).toUpperCase();
            result.innerHTML = `Промокод активирован!<br>Ключ: <strong>${key}</strong>`;
            result.style.color = '#4caf50';
            document.getElementById('promoInput').value = '';
        }

        // Активация ключа
        function activateKey() {
            const key = document.getElementById('keyInput').value.trim().toUpperCase();
            const result = document.getElementById('keyResult');

            if (!key) {
                result.textContent = 'Введите ключ';
                result.style.color = '#ff6b6b';
                return;
            }

            if (key.startsWith('KEY-')) {
                let newStatus = 'free';
                
                if (key.includes('CORP')) newStatus = 'corp';
                else if (key.includes('PERSON')) newStatus = 'person';
                else if (key.includes('PRO')) newStatus = 'pro';

                // Обновление статуса
                if (currentUser) {
                    currentUser.status = newStatus;
                    saveUser(currentUser);
                    
                    // Обновление UI
                    document.getElementById('userStatus').textContent = newStatus.toUpperCase();
                    document.getElementById('statusDisplay').textContent = newStatus.toUpperCase();
                    
                    result.textContent = `Статус обновлен: ${newStatus.toUpperCase()}`;
                    result.style.color = '#4caf50';
                    document.getElementById('keyInput').value = '';
                }
            } else {
                result.textContent = 'Неверный ключ';
                result.style.color = '#ff6b6b';
            }
        }

        // Отправка сообщения
        function sendMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (!message) return;

            // Добавление сообщения пользователя
            addMessage(message, 'user');
            input.value = '';

            // Имитация ответа ИИ
            setTimeout(() => {
                const responses = [
                    "Я понял ваш запрос. Могу предложить следующее решение...",
                    "Интересный вопрос! Давайте разберем его подробнее...",
                    "На основе вашего запроса, рекомендую рассмотреть эти варианты...",
                    "Для решения этой задачи вам потребуется...",
                    "Я проанализировал ситуацию и готов предоставить рекомендации..."
                ];
                
                const response = responses[Math.floor(Math.random() * responses.length)];
                addMessage(response, 'ai');
            }, 1000);
        }

        // Добавление сообщения в чат
        function addMessage(text, sender) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            
            messageDiv.className = `message ${sender}-message`;
            messageDiv.textContent = text;
            
            container.appendChild(messageDiv);
            container.scrollTop = container.scrollHeight;
            
            // Сохранение в историю
            messages.push({ text, sender, time: new Date() });
        }

        // Новый чат
        function startNewChat() {
            messages = [];
            document.getElementById('messagesContainer').innerHTML = '';
            closeMenu();
            
            // Добавление приветственного сообщения
            setTimeout(() => {
                addMessage("Создан новый чат. Чем могу помочь?", 'ai');
            }, 300);
        }

        // Выход
        function logout() {
            currentUser = null;
            messages = [];
            
            // Очистка чата
            document.getElementById('messagesContainer').innerHTML = '';
            
            // Показать экран аутентификации
            document.getElementById('chatScreen').style.display = 'none';
            document.getElementById('authScreen').style.display = 'flex';
            
            // Сброс форм
            document.getElementById('loginForm').reset();
            document.getElementById('registerForm').reset();
            switchTab('login');
            
            closeMenu();
        }
    </script>
</body>
</html>
